name: Package standalone binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    env:
      RUSTUP_TOOLCHAIN: "1.98.0"
      TARGET: ${{ matrix.target }}

    steps:
      - name: Check out the source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target "$TARGET"

      - name: Test the clean checkout
        run: cargo test --locked --all-targets --all-features

      - name: Build the standalone artifact
        run: ./scripts/package.sh "$TARGET" dist

      - name: Verify architecture, CLI, and PTY behavior
        run: ./scripts/verify-artifact.sh "dist/songdial-$TARGET" "$TARGET"

      - name: Upload the verified standalone binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: dist/songdial-${{ matrix.target }}
          archive: false
          if-no-files-found: error
          retention-days: 30
